data:
  pad: data/seizoenen

doel: thuiswinst

features:
  numeriek:
    - verschil_vorm_punten
    - verschil_vorm_voor
    - verschil_vorm_tegen
    - verschil_vorm_schoten
    - verschil_aantal_vorige
  categorisch: []

split:
  train: ["21-22", "22-23", "23-24"]
  validatie: "24-25"
  test: "25-26"
  live: "26-27"
  seed: 42

model:
  pad: models/model.joblib
  max_iter: 1000
  # Slechter dan baseline 1 (vast percentage) mag niet naar productie.
  maximum_log_loss: 0.68

winst:
  inzet: 10            # euro per tip
  minimum_tips: 20     # een drempel met minder tips is geluk, geen patroon
  drempels: [0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]